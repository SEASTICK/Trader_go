[package]
name = "trader-go-universe"
version = "0.1.0"
description = "TraderGO Universe: a read-only map of the TraderGO project"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify-debouncer-full = "0.7"
ignore = "0.4"
regex = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
