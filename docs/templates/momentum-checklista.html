<div id="momentum-checklista">
  <style>
    #momentum-checklista { color:var(--foreground); }
    #momentum-checklista .phase-head { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding-right:96px; margin-bottom:16px; }
    #momentum-checklista .phase-head h2 { margin:0; }
    #momentum-checklista .phase-counts { display:flex; justify-content:space-between; gap:12px; margin-bottom:10px; }
    #momentum-checklista .phase-groups { margin:20px 0; }
    #momentum-checklista .phase-group { border-bottom:1px solid var(--border); padding:16px 0; }
    #momentum-checklista .phase-group > summary { padding:8px 0; }
    #momentum-checklista .phase-subcount { display:block; margin-top:6px; margin-left:20px; color:var(--muted-foreground); }
    #momentum-checklista .phase-tasks { margin-top:12px; display:grid; gap:14px; }
    #momentum-checklista .phase-task .form-check { align-items:start; }
    #momentum-checklista .phase-evidence { margin:6px 0 0 28px; color:var(--muted-foreground); }
    #momentum-checklista .phase-meta { margin-top:12px; color:var(--muted-foreground); }
    #momentum-checklista .phase-status { color:var(--muted-foreground); margin-left:6px; }
    #momentum-checklista .phase-actions { display:flex; flex-wrap:wrap; gap:8px; }
    #momentum-checklista textarea { margin-top:12px; }
    @media (max-width:480px) { #momentum-checklista .phase-head { padding-right:0; padding-top:32px; } }
  </style>
  <div class="phase-head"><h2>Efterföljare till H-0013 – Arbetsplan</h2><span class="viz-badge">8 arbetsområden</span></div>
  <div class="phase-counts" aria-live="polite"><span id="mom-count"></span><span id="mom-percent" class="tabular-nums"></span></div>
  <div class="progress" role="progressbar" aria-label="Verifierade uppgifter för efterföljaren till H-0013" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" id="mom-bar" style="width:0%"></div></div>
  <div id="mom-groups" class="phase-groups"></div>
  <div class="phase-actions">
    <button type="button" class="btn btn-primary" id="mom-refresh">Kontrollera senaste kod</button>
    <button type="button" class="btn" id="mom-expand">Visa alla</button>
    <button type="button" class="btn" id="mom-copy">Kopiera checklistan</button>
  </div>
  <p class="phase-meta text-small" id="mom-meta"></p>
  <p class="phase-meta text-small">Bockar betyder verifierat arbete. Ny kod kräver granskning före nästa bock. Den här vyn visar senast kontrollerad status i projektet.</p>
  <p id="mom-feedback" aria-live="polite" class="text-small"></p>
  <textarea id="mom-copy-text" class="form-control" aria-label="Checklista att kopiera" rows="12" hidden readonly></textarea>
  <script type="application/json" id="mom-data">__MOMENTUM_DATA__</script>
  <script>
    (() => {
      const root=document.getElementById('momentum-checklista');
      const data=JSON.parse(root.querySelector('#mom-data').textContent);
      const all=data.groups.flatMap(g=>g.tasks), done=all.filter(t=>t.status==='done').length;
      const percent=Math.round(done/all.length*100);
      root.querySelector('#mom-count').textContent=`${done} av ${all.length} uppgifter verifierade`;
      root.querySelector('#mom-percent').textContent=percent+' %';
      root.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(percent));
      root.querySelector('#mom-bar').style.width=percent+'%';
      root.querySelector('#mom-meta').textContent=`Metodgranskning · Kontrollerad ${data.updated} · Kodversion ${data.reviewed_revision} · ${data.reviewed_scope || ''}`;
      const groupNodes=[];
      for (const [index,group] of data.groups.entries()) {
        const details=document.createElement('details'); details.className='phase-group'; details.dataset.group=group.id; details.open=index===0;
        const summary=document.createElement('summary'); summary.className='cursor-interaction';
        const title=document.createElement('span');title.textContent=group.title;summary.append(title);
        const count=document.createElement('span');count.className='phase-subcount text-small';
        const complete=group.tasks.filter(t=>t.status==='done').length;
        const ongoing=group.tasks.filter(t=>t.status==='in_progress').length;
        count.textContent=`${complete}/${group.tasks.length} klara`+(ongoing?' · Pågår':'');summary.append(count);details.append(summary);
        const tasks=document.createElement('div');tasks.className='phase-tasks';
        for(const task of group.tasks) {
          const row=document.createElement('div');row.className='phase-task';
          const label=document.createElement('label');label.className='form-check';
          const check=document.createElement('input');check.type='checkbox';check.className='form-check-input';check.checked=task.status==='done';check.disabled=true;
          const name=document.createElement('span');name.className='form-check-label';name.textContent=task.title;
          if(task.status==='in_progress'){const status=document.createElement('span');status.className='phase-status text-small';status.textContent='Pågår';name.append(status);}
          label.append(check,name);row.append(label);
          if(task.evidence.length){const proof=document.createElement('p');proof.className='phase-evidence text-small';proof.textContent=task.id+' · '+task.evidence.map(e=>e.file+' — '+e.detail).join(' ');row.append(proof);}
          tasks.append(row);
        }
        details.append(tasks);root.querySelector('#mom-groups').append(details);groupNodes.push(details);
      }
      const expand=root.querySelector('#mom-expand');
      const updateExpand=()=>{expand.textContent=groupNodes.every(n=>n.open)?'Fäll ihop':'Visa alla';};
      const save=()=>{window.openai?.setWidgetState?.({modelContent:{project:'momentum-successor'},privateContent:{open:groupNodes.filter(n=>n.open).map(n=>n.dataset.group)}})?.catch(()=>{});};
      const restore=state=>{const opened=state?.privateContent?.open;if(Array.isArray(opened)){for(const node of groupNodes)node.open=opened.includes(node.dataset.group);updateExpand();}};
      restore(window.openai?.widgetState);
      window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
      for(const node of groupNodes)node.addEventListener('toggle',updateExpand);
      root.querySelector('#mom-groups').addEventListener('click',event=>{if(event.target.closest('summary'))queueMicrotask(save);});
      expand.addEventListener('click',()=>{const opened=!groupNodes.every(n=>n.open);groupNodes.forEach(n=>n.open=opened);updateExpand();save();});
      root.querySelector('#mom-copy').addEventListener('click',async()=>{
        const text=[data.title,`${done}/${all.length} verifierade`,...data.groups.flatMap(g=>['',g.title,...g.tasks.map(t=>`- [${t.status==='done'?'x':' '}] ${t.id} ${t.title}${t.status==='in_progress'?' (pågår)':''}`)])].join('\n');
        try {await navigator.clipboard.writeText(text);root.querySelector('#mom-feedback').textContent='Checklistan kopierad.';}
        catch {const area=root.querySelector('#mom-copy-text');area.hidden=false;area.value=text;area.focus();area.select();root.querySelector('#mom-feedback').textContent='Markera och kopiera texten nedan.';}
      });
      root.querySelector('#mom-refresh').addEventListener('click',async()=>{
        const feedback=root.querySelector('#mom-feedback');
        if(!window.openai?.sendFollowUpMessage){feedback.textContent='Skriv ”uppdatera momentummodellens checklista” i chatten för en ny kontroll.';return;}
        try{await window.openai.sendFollowUpMessage({prompt:'Uppdatera momentummodellens checklista från aktuell kod i SEASTICK/Trader_go. Läs docs/momentum-status.json och docs/momentum-checklista.md, granska relevanta kodändringar och tester, markera endast verifierat klart med källor och regenerera checklistan samt vyn. Starta inga forskningskörningar, papperspiloter, driftsättningar eller publiceringar. H-0013 förblir REJECT.',title:'Kontrollera momentummodellens status'});}
        catch{feedback.textContent='Skriv ”uppdatera momentummodellens checklista” i chatten för en ny kontroll.';}
      });
    })();
  </script>
</div>
