name: App check

# Kontroll av gränssnittet. Jobbet `check` är snabbt och billigt (Linux: tester, typkontroll, bygge).
# Jobbet `windows-smoke` bygger den riktiga Tauri-appen på Windows (WebView2) och kör ett röktest i skrivbordsläget.
# Inget av jobben paketerar, signerar, laddar upp artefakter eller publicerar en release, och inga hemligheter används.
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-check.yml"
  # Även direkt-push till main (docs/samarbete.md): fångar ett rött main direkt, inte först vid nästa PR.
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Windows-grind: den faktiska Tauri/WebView2-målet, inte bara Vite. Kompilerar utan att paketera och startar programmet.
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # Egen cachenyckel (debug-bygge utan --target). Sparas aldrig från PR (save-if), bara läses.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          shared-key: app-smoke-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Kompilera skrivbordsappen (debug, inbäddat gränssnitt) utan installationsprogram, utan uppdateringsfiler och utan signering.
      # smoke/tauri.smoke.conf.json slår bara på WebView2:s fjärrfelsökningsport i det här testbygget (aldrig i ett släpp).
      # Tauri/wry skickar egna webbläsarargument, så miljövariabeln WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS ensam räcker inte (körning 22adfb3: ingen port).
      - run: npm run tauri build -- --debug --no-bundle --config smoke/tauri.smoke.conf.json
      # Röktestet styr WebView2 via Chrome DevTools-protokollet med playwright-core (ingen webbläsarnedladdning).
      - name: Installera playwright-core (fast version, utanför repot)
        run: npm install --prefix "$env:RUNNER_TEMP/pw" playwright-core@1.49.1 --no-audit --no-fund --no-package-lock
      - name: Röktest av skrivbordsappen (Windows, tomt datalager)
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP/pw/node_modules"
          node smoke/desktop-smoke.cjs "$PWD/src-tauri/target/debug/trader-go.exe"
