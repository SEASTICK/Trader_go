# Tests on every pull request (macOS and Windows). Publishes nothing. The PR installer comes
# from windows-build.yml; releases from desktop-release.yml (see docs/release.md).
name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/**"

# A newer push to the same PR replaces the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Tauri embeds app/dist at compile time, so build the front end (also type-checks it).
      - name: Build front end
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

