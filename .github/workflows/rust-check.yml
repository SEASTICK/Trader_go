name: Rust check

# Backend-tester på Linux (billigast): fmt, clippy och cargo test. Körs bara när Rust-koden
# ändras. Gränssnittet kontrolleras av app-check.yml, Windows-bygget av windows-build.yml.
on:
  pull_request:
    paths:
      - "app/src-tauri/**"
      - ".github/workflows/rust-check.yml"
  # Även direkt-push till main (docs/samarbete.md): fångar ett rött main direkt, inte först vid nästa PR.
  push:
    branches: [main]
    paths:
      - "app/src-tauri/**"
      - ".github/workflows/rust-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Systembibliotek som Tauri behöver för att kompilera på Linux.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Tauri bäddar in app/dist när den kompilerar.
      - name: Build front end
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: cargo fmt
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test
