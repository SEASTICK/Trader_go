[package]
name = "trader-go"
version = "0.1.0"
description = "Trader_go research app (paper trading only)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-single-instance = "2"
# Marknadsdata (src/market): publik data, operativsystemets TLS, lokal SQLite.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
tungstenite = { version = "0.24", features = ["native-tls"] }
fastrand = "2"

[dev-dependencies]
minisign-verify = "0.2"
base64 = "0.22"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
